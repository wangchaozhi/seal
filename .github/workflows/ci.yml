name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: apps/api/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Unit and integration tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./internal/platform ./internal/storage ./internal/httpx
      - name: Vet
        run: go vet ./...

  web:
    name: React Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Reject public source maps and fonts
        run: |
          if find dist -type f \( -name '*.map' -o -iname '*.woff*' -o -iname '*.ttf' -o -iname '*.otf' \) | grep -q .; then
            echo 'Public source map or font file found in Web build'
            exit 1
          fi

  worker:
    name: Render Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  deployment-contract:
    name: Deployment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Validate JSON contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('docs/contracts').glob('*.json'):
              json.loads(path.read_text())
              print(f'validated {path}')
          PY
