# Start CSP in Report-Only mode and observe violations before enforcement.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://storage.example.com; font-src 'self'; connect-src 'self' https://api.example.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests; report-to csp-endpoint" always;
add_header Reporting-Endpoints 'csp-endpoint="https://api.example.com/security/csp-report"' always;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# Never publish JavaScript source maps.
location ~* \.map$ { return 404; }

# Static assets can be cached because filenames should be content hashed.
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

# API responses containing user data should not be cached by shared proxies.
location /api/ {
  proxy_pass http://go_api;
  add_header Cache-Control "no-store" always;
}
